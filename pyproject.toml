[project]
name = "trihybrid-ltne-pinn"
version = "0.1.0"
description = "Physics-informed neural network for trihybrid nanofluid flow with LTNE, Darcy-Forchheimer and magnetic field (PyTorch)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "shap>=0.44",
  "lime>=0.2",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "ruff"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.0",
  "mkdocstrings>=1.0",
  "mkdocstrings-python>=1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
