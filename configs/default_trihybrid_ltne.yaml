# Default parameters for trihybrid nanofluid in coaxial cylinder.
# LTNE + Darcy-Forchheimer porous medium + transverse magnetic field.
# All physics, model, and training choices are config-driven (no hardcoding).
# Equations are selected via the `equations` block: toggle terms without
# editing Python code.

domain:
  eta0: 4.0
  n_collocation: 512
  dtype: float32
  seed: 0

physics:
  M: 1.0               # Magnetic parameter (Hartmann number squared scaling)
  Fr: 0.2              # Forchheimer (non-Darcy inertia) coefficient
  Kp: 0.5              # Porous permeability parameter (1/Da)
  Rd: 0.5              # Thermal radiation parameter
  Pr: 6.2              # Prandtl number (water based)
  Ec: 0.1              # Eckert number (viscous / Joule dissipation)
  Hs: 1.0              # Interphase heat-transfer coeff (fluid side, LTNE)
  Hsg: 1.0             # Interphase heat-transfer coeff (solid side, LTNE)
  Sc: 0.6              # Schmidt number
  Kr: 0.2              # Chemical reaction rate
  Sr: 0.1              # Soret coupling coefficient
  Q: 0.05              # Volumetric heat source / sink
  gamma_curv: 0.1      # Cylinder curvature parameter
  slip: 0.0            # Velocity slip at inner cylinder
  Bi_f: null           # Robin Biot number (null => Dirichlet theta_f=1)
  omega_ratio: 0.0     # Outer cylinder rotation ratio f'(eta0)
  f_outer: 0.0         # Outer wall stream-function value (entrainment)

nanofluid:
  base_fluid: water
  rho_f: 997.1
  mu_f: 0.000891
  k_f: 0.613
  cp_f: 4179.0
  sigma_f: 0.05
  # Three nanoparticles for trihybrid (Al2O3, Cu, TiO2 as example).
  particles:
    - name: Al2O3
      rho: 3970.0
      k: 40.0
      cp: 765.0
      sigma: 3.5e6
      phi: 0.01
    - name: Cu
      rho: 8933.0
      k: 400.0
      cp: 385.0
      sigma: 5.96e7
      phi: 0.01
    - name: TiO2
      rho: 4250.0
      k: 8.95
      cp: 686.2
      sigma: 2.38e6
      phi: 0.01

# Equation selection: the governing PDE is assembled dynamically from
# these term lists. To change the physics, edit the lists here.
equations:
  momentum_terms:
    - viscous
    - inertia
    - magnetic
    - darcy
    - forchheimer
    - curvature
  fluid_energy_terms:
    - conduction
    - radiation
    - advection
    - interphase
    - joule
    - heat_source
  solid_energy_terms:
    - conduction
    - interphase
  concentration_terms:
    - diffusion
    - advection
    - reaction
    - soret

model:
  input_dim: 1
  output_dim: 4         # [f, theta_f, theta_s, phi]
  hidden_layers: [128, 128, 128]
  activation: tanh
  initialization: xavier
  output_activation: linear

training:
  epochs: 20000
  lr: 0.001
  optimizer: adam
  scheduler: null       # e.g. {type: step, step_size: 5000, gamma: 0.5}
  pde_weight: 1.0
  bc_weight: 10.0
  log_every: 500
  device: auto          # auto | cpu | cuda
  checkpoint_dir: checkpoints
  save_every: 2000

solver:
  bvp_mesh: 200
  tol: 1.0e-8
  max_nodes: 2000

outputs:
  raw_dir: data/raw
  processed_dir: data/processed
  baseline_file: baseline.npz
  metrics_file: metrics.json
